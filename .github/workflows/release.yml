name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # 浅克隆拿不到 annotated tag 对象，附注会空，Release 正文会退化成 commit message
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build frontend
        run: make frontend

      - name: Test
        working-directory: backend
        run: go test ./...

      - name: Extract version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Linux amd64
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags="-w -s" -o ../wireguard-ui-${{ steps.version.outputs.version }}-linux-amd64 .

      - name: Build Linux arm64
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -ldflags="-w -s" -o ../wireguard-ui-${{ steps.version.outputs.version }}-linux-arm64 .

      - name: Extract release notes from tag
        id: release_notes
        run: |
          TAG_MSG=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [ -z "$(echo "$TAG_MSG" | tr -d '[:space:]')" ]; then
            TAG_MSG=$(git log -1 --format='%B' "${GITHUB_REF_NAME}")
          fi
          {
            echo "body<<EOF"
            echo "$TAG_MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          generate_release_notes: true
          files: |
            wireguard-ui-${{ steps.version.outputs.version }}-linux-amd64
            wireguard-ui-${{ steps.version.outputs.version }}-linux-arm64
